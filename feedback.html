<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback | My Portfolio</title>
    <script src="js/feedback.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="feedback-section">

            <h1>Feedback</h1>

            <p>
                I would love to hear your feedback about my portfolio.
                Please fill in the form below.
            </p>

            <form id="feedback-form" novalidate>

                <div>
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="fullName" aria-describedby="full-name-error">
                    <p id="full-name-error"></p>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" aria-describedby="email-error" pattern="[^@\s]+@[^@\s]+\.[^@\s]+">
                    <p id="email-error"></p>
                </div>

                <div>
                    <label for="topic">Topic of Interest</label>

                    <select id="topic" name="topic" aria-describedby="topic-error">
                        <option value="">Choose a topic</option>
                        <option value="web-development">Web Development</option>
                        <option value="web-design">Web Design</option>
                        <option value="javascript">JavaScript</option>
                    </select>
                    <p id="topic-error"></p>
                </div>

                <div>
                    <label for="comments">Comments</label>

                    <textarea id="comments" name="comments" rows="6" aria-describedby="character-counter comments-error"></textarea>

                    <p id="character-counter" class="counter-error">0 characters - minimum 15 - 40 characters required</p>
                    <p id="comments-error"></p>
                </div>

                <div>
                    <label for="website">Website (Optional)</label>
                    <input type="url" id="website" name="website" aria-describedby="website-error">

                    <p id="website-error"></p>
                </div>

                <button type="submit">Submit</button>
                <button type="button" id="clear-button">Clear</button>

            </form>

            <p id="success-message" role="status"></p>

        </section>

    </main>

</body>
</html>
